<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#08080b"
  >

  <title>$REKT — Devnet Launcher</title>

  <link
    rel="stylesheet"
    href="./style.css"
  >
</head>

<body>

  <main class="card">

    <div class="badge">
      SOLANA DEVNET • TEST ONLY
    </div>

    <div class="coin">
      🐹
    </div>

    <h1>
      $REKT
    </h1>

    <p class="tag">
      STILL HERE.
    </p>

    <p class="sub">
      Same degen. Different day.
    </p>


    <section>

      <div>
        <span>Name</span>
        <b>REKT</b>
      </div>

      <div>
        <span>Symbol</span>
        <b>REKT</b>
      </div>

      <div>
        <span>Supply</span>
        <b>100,000,000</b>
      </div>

      <div>
        <span>Decimals</span>
        <b>6</b>
      </div>

      <div>
        <span>Network</span>
        <b>Devnet</b>
      </div>

    </section>


    <button id="connectBtn">
      Connect Phantom
    </button>


    <button
      id="createBtn"
      disabled
    >
      Create 100M REKT
    </button>


    <p id="wallet">
      Wallet: not connected
    </p>


    <div id="status"></div>


    <div id="result"></div>


    <p class="warning">
      Devnet only. No real-value token and no mainnet transaction.
    </p>

  </main>


  <script
    type="module"
    src="./app.js"
  ></script>

</body>
</html>
